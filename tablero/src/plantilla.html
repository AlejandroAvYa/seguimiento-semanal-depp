<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Seguimiento semanal DEPP · Subsecretaría de Prevención del Delito</title>
<style>
/*__FUENTES__*/
:root{
  --gob-blue:#0063b1;--gob-red:#e82c36;
  --c-blue:#0063b1;--c-blue-700:#0a4f8c;--c-blue-900:#08355d;--c-blue-950:#06294a;--c-blue-soft:#e6f0fa;
  --c-red:#c22a32;--c-red-soft:#fbe9ea;
  --c-ok:#1d7a52;--c-ok-soft:#e4f3ec;
  --c-amber:#9a6a08;--c-amber-soft:#fbf0db;
  --c-slate:#6b788c;--c-slate-soft:#eef1f5;
  --c-teal:#2f7d86;--c-teal-soft:#e3f1f2;
  --bg:#eaeef3;--surface:#fff;--surface-2:#f5f7fa;--surface-3:#eef2f7;
  --ink:#16243b;--ink-2:#4a5a72;--ink-3:#6b7a90;--line:#e0e6ee;--line-2:#d2dae4;
  --radius:12px;--shadow-sm:0 1px 2px rgba(16,38,68,.06),0 1px 3px rgba(16,38,68,.05);--shadow-lg:0 18px 50px rgba(8,33,61,.18);
  --sans:'Public Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --sidebar-w:248px;
}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid #2b8be0;outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.tnum{font-variant-numeric:tabular-nums}.mono{font-family:var(--mono);font-weight:600;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- estructura */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.sidebar{background:linear-gradient(178deg,var(--c-blue-950) 0%,var(--c-blue-900) 60%,#0a3f70 100%);color:#dce7f3;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sidebar__brand{padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.09)}
.sidebar__logo{width:112px;border-radius:6px;display:block;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.sidebar__k{margin-top:14px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#a9c6e3;font-weight:700}
.sidebar__v{font-size:13px;color:#e3edf7;margin-top:4px;line-height:1.35;font-weight:600}
.nav{padding:14px 12px;flex:1;overflow-y:auto}
.nav__group{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8fb0d2;font-weight:700;padding:8px 12px 6px}
.nav__item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;border-radius:9px;color:#c9daec;font-size:13.5px;font-weight:500;margin-bottom:2px}
.nav__item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav__item[aria-current="page"]{background:rgba(255,255,255,.13);color:#fff;font-weight:650;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.nav__num{flex:none;width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:11.5px;font-family:var(--mono)}
.nav__item[aria-current="page"] .nav__num{background:var(--gob-red);color:#fff}
.nav__count{margin-left:auto;font-size:11px;font-weight:700;background:rgba(232,44,54,.85);color:#fff;border-radius:999px;padding:1px 7px}
.sidebar__foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.09);font-size:11px;color:#a3bdd8;line-height:1.5}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:18px;padding:0 28px;min-height:64px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;flex-wrap:wrap}
.topbar__title{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.topbar__sub{font-size:12px;color:var(--ink-3)}
.topbar__spacer{flex:1}
.cutpick{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:999px;padding:4px 6px 4px 14px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.cutpick select{border:none;background:transparent;font-weight:700;color:var(--ink);padding:4px 4px;cursor:pointer;max-width:260px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.dot.valido{background:var(--c-ok)}.dot.valido_con_observaciones{background:#c6890f}.dot.en_revision{background:var(--c-red)}.dot.manual{background:var(--c-slate)}
.meta{text-align:right}.meta .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}.meta .v{font-size:12.5px;font-weight:600}
.banner{margin:16px 28px 0;padding:11px 14px;border-radius:10px;font-size:13px;display:block;border:1px solid}
.banner.warn{background:var(--c-amber-soft);border-color:#ecd39b;color:#5f4206}
.banner.bad{background:var(--c-red-soft);border-color:#f0c4c7;color:#7d1d23}
.banner.info{background:var(--c-blue-soft);border-color:#c5dcf2;color:#0b3f6e}
.banner strong{font-weight:700}
.page{padding:22px 28px 56px;max-width:1360px;width:100%;margin:0 auto}
.page__eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--c-blue);font-weight:700}
.page__title{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:4px 0 0}
.page__lead{font-size:13.5px;color:var(--ink-2);margin:6px 0 18px;max-width:80ch}

/* ---------- héroe */
.hero{background:linear-gradient(135deg,var(--c-blue-950) 0%,var(--c-blue-900) 60%,#0a3f70 100%);border-radius:18px;padding:18px 24px 20px;color:#fff;margin-bottom:14px}
.hero__top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.hero__k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#a9cbff}
.hero__t{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:3px 0 2px}
.hero__meta{font-size:13px;color:#d0def3}
.hero__side{font-size:13px;color:#d0def3;text-align:right}
.hero__side b{color:#fff;font-size:15px}
.hero__stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:14px}
.hstat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:11px 14px 12px;text-align:left;color:#fff;transition:background .15s}
.hstat:hover{background:rgba(255,255,255,.16)}
.hstat__n{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.03em}
.hstat__l{font-size:12.5px;font-weight:700;margin-top:5px;color:#eef4fd}
.hstat__s{font-size:11.5px;color:#b9cde8;margin-top:2px}
.hstat.is-hot .hstat__n{color:#ffb4b8}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:4px 2px 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* ---------- tarjetas */
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1.1fr 1fr 1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);min-width:0}
.card__head{display:flex;align-items:baseline;gap:10px;padding:15px 18px 4px}
.card__title{font-size:13.5px;font-weight:750;color:var(--ink)}
.card__title.red{color:var(--c-red)}.card__title.amber{color:var(--c-amber)}
.card__sub{font-size:11.5px;color:var(--ink-3);margin-left:auto}
.card__body{padding:8px 18px 16px}
.list{list-style:none;margin:0;padding:0}
.li{display:flex;gap:12px;align-items:flex-start;padding:9px 6px;border-radius:8px;width:100%;text-align:left}
button.li:hover{background:var(--surface-2)}
.li__main{min-width:0;flex:1}
.li__t{font-size:13px;font-weight:650;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li__s{font-size:11.5px;color:var(--ink-3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li__r{font-size:12px;font-weight:700;white-space:nowrap;text-align:right}
.li__r.red{color:var(--c-red)}.li__r.amber{color:var(--c-amber)}.li__r.blue{color:var(--c-blue)}
.more{display:inline-block;font-size:12px;color:var(--c-blue);font-weight:700;padding:8px 6px 0}
.more:hover{text-decoration:underline}
.empty-note{font-size:12.5px;color:var(--ink-3);padding:10px 6px}
.chip{display:inline-flex;align-items:center;font-size:10.5px;font-weight:750;letter-spacing:.02em;border-radius:6px;padding:2px 7px;white-space:nowrap;flex:none}
.chip.dec{background:var(--c-amber-soft);color:#7a5306}.chip.apo{background:var(--c-blue-soft);color:var(--c-blue-700)}
.chip.area{background:var(--surface-3);color:var(--ink-2);font-family:var(--mono);font-weight:600}
.chip.mov-e{background:var(--c-ok-soft);color:var(--c-ok)}.chip.mov-a{background:var(--c-blue-soft);color:var(--c-blue-700)}.chip.mov-i{background:var(--c-teal-soft);color:#1f5c63}.chip.mov-c{background:var(--c-slate-soft);color:var(--ink-2)}
.srow{display:grid;grid-template-columns:170px 1fr 90px;gap:12px;align-items:center;padding:8px 4px;border-radius:8px;width:100%;text-align:left}
.srow:hover{background:var(--surface-2)}
.srow__l{font-size:12.5px;font-weight:700}.srow__l small{display:block;font-size:11px;color:var(--ink-3);font-weight:500}
.srow__n{font-size:12px;color:var(--ink-3);text-align:right}.srow__n b{display:block;color:var(--ink);font-size:13px}
.stack{display:flex;height:20px;border-radius:999px;overflow:hidden;background:var(--surface-3)}
.stack span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;min-width:0;overflow:hidden}
.s-pend{background:#7b899e}.s-curso{background:var(--c-blue)}.s-rev{background:#2f7d86}.s-bloq{background:var(--c-red)}.s-venc{background:#e0858a}
.feed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 16px}

/* ---------- filtros y tabla */
.filterbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:11px 14px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.filterbar__label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.fsel{background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;font-size:12.5px;font-weight:500;max-width:240px}
.fsel.is-set{background:var(--c-blue-soft);border-color:var(--c-blue);color:var(--c-blue-700);font-weight:650}
.fsearch{flex:1;min-width:200px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;font-size:12.5px}
.linkbtn{font-size:12px;color:var(--c-blue);font-weight:700;padding:6px 8px;border-radius:7px}
.linkbtn:hover{background:var(--c-blue-soft)}
.count{font-size:12px;color:var(--ink-3);font-weight:500;padding:0 4px}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
thead th{position:sticky;top:0;background:var(--surface-2);color:var(--ink-2);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}tbody tr:hover{background:#f7f9fc}
tbody tr:last-child td{border-bottom:none}
td.nowrap{white-space:nowrap}
.cell-t{font-weight:650}.cell-s{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.badge{display:inline-block;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:750;white-space:nowrap}
.b-Pendiente{background:var(--c-slate-soft);color:#4b5a70}.b-En-curso{background:var(--c-blue-soft);color:var(--c-blue-700)}
.b-En-revisión{background:var(--c-teal-soft);color:#1f5c63}.b-Bloqueado{background:var(--c-red-soft);color:var(--c-red)}
.b-Entregado{background:var(--c-ok-soft);color:var(--c-ok)}.b-Cancelado{background:#eceef1;color:#5d6676}
.late{display:block;font-size:11px;color:var(--c-red);font-weight:700;margin-top:3px}

/* ---------- ficha */
.drawer-bg{position:fixed;inset:0;background:rgba(8,26,48,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:50;box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.drawer__head{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer__k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.drawer__t{font-size:18px;font-weight:800;letter-spacing:-.01em;margin-top:3px}
.drawer__close{margin-left:auto;width:36px;height:36px;border-radius:8px;font-size:20px;color:var(--ink-2)}
.drawer__close:hover{background:var(--surface-2)}
.drawer__body{padding:16px 22px 28px;overflow:auto}
.dl{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:13px;margin:0}
.dl dt{color:var(--ink-3);font-weight:600}.dl dd{margin:0}
.sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:750;margin:20px 0 8px}
.diff{font-size:12.5px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.diff div{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:7px 10px;border-top:1px solid var(--line)}
.diff div:first-child{border-top:none}.diff del{color:var(--ink-3)}.diff ins{text-decoration:none;font-weight:650}
.hist{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line-2);margin-left:6px;padding-left:14px}
.hist div{position:relative;padding:5px 0;font-size:12.5px}
.hist div::before{content:"";position:absolute;left:-20px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--c-blue);border:2px solid #fff}

/* ---------- minuta */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:650;border:1px solid var(--line-2);background:var(--surface);color:var(--c-blue-700)}
.btn:hover:not(:disabled){background:var(--c-blue-soft)}
.btn.primary{background:var(--c-blue);border-color:var(--c-blue);color:#fff}.btn.primary:hover:not(:disabled){background:var(--c-blue-700)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{padding:8px 13px;font-size:12.5px;font-weight:650;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--c-blue);color:#fff}
.status-msg{font-size:12.5px;color:var(--ink-3);margin-left:4px}
.paper{background:#fff;max-width:816px;margin:0 auto;padding:46px 62px 52px;box-shadow:var(--shadow-sm);border:1px solid var(--line);font-family:Verdana,Geneva,sans-serif;font-size:12px;line-height:1.45;color:#000}
.paper .plogo{width:62px;display:block;margin-bottom:16px}
.paper .pk{text-align:center;font-weight:700}
.paper .pt{text-align:center;font-weight:700}
.paper .pr{text-align:center;margin-bottom:12px}
.paper .pdraft{text-align:center;font-weight:700;margin-top:2px}
.paper h3{background:#0e2841;color:#fff;font-size:12px;font-weight:700;margin:14px 0 6px;padding:2px 6px;text-transform:uppercase}
.paper p{margin:0 0 6px;text-align:justify}
.paper .pg{font-weight:700;margin:8px 0 3px}.paper .pg span{font-weight:400;color:#404040;font-size:10.5px}
.paper ul{margin:0 0 4px;padding-left:22px}.paper li{margin:0 0 4px;text-align:justify}
.paper .pn{font-style:italic;font-size:10.5px;margin:0 0 6px 22px}
.paper .pfoot{border-top:1px solid #999;margin-top:22px;padding-top:6px;font-size:9.5px}
.paper sup{font-size:8px}
.movtable{margin-top:22px}

/* ---------- calidad y carga */
.kv{display:grid;grid-template-columns:170px 1fr;gap:7px 14px;font-size:13px}
.kv dt{color:var(--ink-3);font-weight:600}.kv dd{margin:0}
.inc{list-style:none;margin:0;padding:0}.inc li{padding:8px 0;border-top:1px solid var(--line);font-size:12.5px;display:flex;gap:10px}
.inc li:first-child{border-top:none}
.lvl{font-size:10.5px;font-weight:800;border-radius:5px;padding:2px 6px;height:fit-content;white-space:nowrap}
.lvl.bloqueante{background:var(--c-red-soft);color:var(--c-red)}.lvl.observacion{background:var(--c-amber-soft);color:#7a5306}
.drop{border:2px dashed var(--line-2);border-radius:12px;padding:18px;text-align:center;color:var(--ink-2);font-size:13px}
.drop.over{border-color:var(--c-blue);background:var(--c-blue-soft)}
.field{display:grid;gap:4px;font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.field input{border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;font-size:13px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
.start{max-width:720px;margin:40px auto;text-align:center}
.start h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0 0 8px}
.start p{color:var(--ink-2)}

@media (max-width:1100px){.hero__stats{grid-template-columns:repeat(3,minmax(0,1fr))}.g3{grid-template-columns:1fr}.feed{grid-template-columns:1fr}}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}.app>*{min-width:0}.sidebar{position:static;height:auto;min-width:0}.sidebar__logo{width:72px}.hero__t{font-size:19px}.hero__side{text-align:left}.cutpick select{max-width:200px}.topbar{position:static}.nav{display:flex;overflow-x:auto;padding:8px}.nav__group,.sidebar__foot{display:none}.nav__item{white-space:nowrap;width:auto}.sidebar__brand{display:flex;gap:14px;align-items:center}.sidebar__k{margin-top:0}.g2{grid-template-columns:1fr}.hero__stats{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar{padding:10px 16px}.page{padding:16px}.banner{margin:12px 16px 0}.paper{padding:28px 22px}.srow{grid-template-columns:110px 1fr 70px}}
@page{size:letter;margin:20mm 22mm}
@media print{
  body{background:#fff}.sidebar,.topbar,.banner,.toolbar,.no-print,.drawer,.drawer-bg{display:none!important}
  .app{display:block}.page{padding:0;max-width:none}.paper{box-shadow:none;border:none;padding:0;max-width:none}
  .paper h3,.paper .pg{break-after:avoid}.paper li{break-inside:avoid}
  .paper h3{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Navegación">
    <div class="sidebar__brand">
      <img class="sidebar__logo" src="__LOGO__" alt="Subsecretaría de Prevención del Delito, Gobierno de Chile">
      <div>
        <div class="sidebar__k">Seguimiento semanal</div>
        <div class="sidebar__v">División de Estudios y Políticas Públicas (DEPP)</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav__group">Vistas</div>
      <button class="nav__item" data-view="resumen"><span class="nav__num">1</span>Resumen del corte</button>
      <button class="nav__item" data-view="compromisos"><span class="nav__num">2</span>Compromisos</button>
      <button class="nav__item" data-view="minuta"><span class="nav__num">3</span>Minuta semanal</button>
      <button class="nav__item" data-view="calidad"><span class="nav__num">4</span>Calidad y carga<span class="nav__count" id="nav-inc" hidden></span></button>
    </nav>
    <div class="sidebar__foot">Uso interno DEPP. El acceso a datos reales se hace con cuenta institucional.<br><span id="version-label"></span></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div>
        <div class="topbar__title" id="view-title">Resumen del corte</div>
        <div class="topbar__sub" id="view-sub">Qué se entregó, qué avanzó y qué requiere atención</div>
      </div>
      <div class="topbar__spacer"></div>
