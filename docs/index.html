:root{
  --gob-blue:#0063b1;--gob-red:#e82c36;
  --c-blue:#0063b1;--c-blue-700:#0a4f8c;--c-blue-900:#08355d;--c-blue-950:#06294a;--c-blue-soft:#e6f0fa;
  --c-red:#c22a32;--c-red-soft:#fbe9ea;
  --c-ok:#1d7a52;--c-ok-soft:#e4f3ec;
  --c-amber:#9a6a08;--c-amber-soft:#fbf0db;
  --c-slate:#6b788c;--c-slate-soft:#eef1f5;
  --c-teal:#2f7d86;--c-teal-soft:#e3f1f2;
  --bg:#eaeef3;--surface:#fff;--surface-2:#f5f7fa;--surface-3:#eef2f7;
  --ink:#16243b;--ink-2:#4a5a72;--ink-3:#6b7a90;--line:#e0e6ee;--line-2:#d2dae4;
  --radius:12px;--shadow-sm:0 1px 2px rgba(16,38,68,.06),0 1px 3px rgba(16,38,68,.05);--shadow-lg:0 18px 50px rgba(8,33,61,.18);
  --sans:'Public Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --sidebar-w:248px;
}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid #2b8be0;outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.tnum{font-variant-numeric:tabular-nums}.mono{font-family:var(--mono);font-weight:600;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- estructura */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.sidebar{background:linear-gradient(178deg,var(--c-blue-950) 0%,var(--c-blue-900) 60%,#0a3f70 100%);color:#dce7f3;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sidebar__brand{padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.09)}
.sidebar__logo{width:112px;border-radius:6px;display:block;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.sidebar__k{margin-top:14px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#a9c6e3;font-weight:700}
.sidebar__v{font-size:13px;color:#e3edf7;margin-top:4px;line-height:1.35;font-weight:600}
.nav{padding:14px 12px;flex:1;overflow-y:auto}
.nav__group{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8fb0d2;font-weight:700;padding:8px 12px 6px}
.nav__item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;border-radius:9px;color:#c9daec;font-size:13.5px;font-weight:500;margin-bottom:2px}
.nav__item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav__item[aria-current="page"]{background:rgba(255,255,255,.13);color:#fff;font-weight:650;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.nav__num{flex:none;width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:11.5px;font-family:var(--mono)}
.nav__item[aria-current="page"] .nav__num{background:var(--gob-red);color:#fff}
.nav__count{margin-left:auto;font-size:11px;font-weight:700;background:rgba(232,44,54,.85);color:#fff;border-radius:999px;padding:1px 7px}
.sidebar__foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.09);font-size:11px;color:#a3bdd8;line-height:1.5}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:18px;padding:0 28px;min-height:64px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;flex-wrap:wrap}
.topbar__title{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.topbar__sub{font-size:12px;color:var(--ink-3)}
.topbar__spacer{flex:1}
.cutpick{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:999px;padding:4px 6px 4px 14px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.cutpick select{border:none;background:transparent;font-weight:700;color:var(--ink);padding:4px 4px;cursor:pointer;max-width:380px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.dot.valido{background:var(--c-ok)}.dot.valido_con_observaciones{background:#c6890f}.dot.en_revision{background:var(--c-red)}.dot.manual{background:var(--c-slate)}
.meta{text-align:right}.meta .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}.meta .v{font-size:12.5px;font-weight:600}
.banner{margin:16px 28px 0;padding:11px 14px;border-radius:10px;font-size:13px;display:block;border:1px solid}
.banner.warn{background:var(--c-amber-soft);border-color:#ecd39b;color:#5f4206}
.banner.bad{background:var(--c-red-soft);border-color:#f0c4c7;color:#7d1d23}
.banner.info{background:var(--c-blue-soft);border-color:#c5dcf2;color:#0b3f6e}
.banner strong{font-weight:700}
.page{padding:22px 28px 56px;max-width:1360px;width:100%;margin:0 auto}
.page__eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--c-blue);font-weight:700}
.page__title{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:4px 0 0}
.page__lead{font-size:13.5px;color:var(--ink-2);margin:6px 0 18px;max-width:80ch}

/* ---------- héroe */
.hero{background:linear-gradient(135deg,var(--c-blue-950) 0%,var(--c-blue-900) 60%,#0a3f70 100%);border-radius:18px;padding:18px 24px 20px;color:#fff;margin-bottom:14px}
.hero__top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.hero__k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#a9cbff}
.hero__t{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:3px 0 2px}
.hero__meta{font-size:13px;color:#d0def3}
.hero__side{font-size:13px;color:#d0def3;text-align:right}
.hero__side b{color:#fff;font-size:15px}
.hero__stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:14px}
.hstat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:11px 14px 12px;text-align:left;color:#fff;transition:background .15s}
.hstat:hover{background:rgba(255,255,255,.16)}
.hstat__n{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.03em}
.hstat__l{font-size:12.5px;font-weight:700;margin-top:5px;color:#eef4fd}
.hstat__s{font-size:11.5px;color:#b9cde8;margin-top:2px}
.hstat.is-hot .hstat__n{color:#ffb4b8}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:4px 2px 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* ---------- tarjetas */
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1.1fr 1fr 1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);min-width:0}
.card__head{display:flex;align-items:baseline;gap:10px;padding:15px 18px 4px}
.card__title{font-size:13.5px;font-weight:750;color:var(--ink)}
.card__title.red{color:var(--c-red)}.card__title.amber{color:var(--c-amber)}
.card__sub{font-size:11.5px;color:var(--ink-3);margin-left:auto}
.card__body{padding:8px 18px 16px}
.list{list-style:none;margin:0;padding:0}
.li{display:flex;gap:12px;align-items:flex-start;padding:9px 6px;border-radius:8px;width:100%;text-align:left}
button.li:hover{background:var(--surface-2)}
.li__main{min-width:0;flex:1}
.li__t{font-size:13px;font-weight:650;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li__s{font-size:11.5px;color:var(--ink-3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li__r{font-size:12px;font-weight:700;white-space:nowrap;text-align:right}
.li__r.red{color:var(--c-red)}.li__r.amber{color:var(--c-amber)}.li__r.blue{color:var(--c-blue)}
.more{display:inline-block;font-size:12px;color:var(--c-blue);font-weight:700;padding:8px 6px 0}
.more:hover{text-decoration:underline}
.empty-note{font-size:12.5px;color:var(--ink-3);padding:10px 6px}
.chip{display:inline-flex;align-items:center;font-size:10.5px;font-weight:750;letter-spacing:.02em;border-radius:6px;padding:2px 7px;white-space:nowrap;flex:none}
.chip.dec{background:var(--c-amber-soft);color:#7a5306}.chip.apo{background:var(--c-blue-soft);color:var(--c-blue-700)}
.chip.area{background:var(--surface-3);color:var(--ink-2);font-family:var(--mono);font-weight:600}
.chip.mov-e{background:var(--c-ok-soft);color:var(--c-ok)}.chip.mov-a{background:var(--c-blue-soft);color:var(--c-blue-700)}.chip.mov-i{background:var(--c-teal-soft);color:#1f5c63}.chip.mov-c{background:var(--c-slate-soft);color:var(--ink-2)}
.srow{display:grid;grid-template-columns:170px 1fr 90px;gap:12px;align-items:center;padding:8px 4px;border-radius:8px;width:100%;text-align:left}
.srow:hover{background:var(--surface-2)}
.srow__l{font-size:12.5px;font-weight:700}.srow__l small{display:block;font-size:11px;color:var(--ink-3);font-weight:500}
.srow__n{font-size:12px;color:var(--ink-3);text-align:right}.srow__n b{display:block;color:var(--ink);font-size:13px}
.stack{display:flex;height:20px;border-radius:999px;overflow:hidden;background:var(--surface-3)}
.stack span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;min-width:0;overflow:hidden}
.s-pend{background:#7b899e}.s-curso{background:var(--c-blue)}.s-rev{background:#2f7d86}.s-bloq{background:var(--c-red)}.s-venc{background:#e0858a}
.feed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 16px}

/* ---------- filtros y tabla */
.filterbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:11px 14px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.filterbar__label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.fsel{background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;font-size:12.5px;font-weight:500;max-width:240px}
.fsel.is-set{background:var(--c-blue-soft);border-color:var(--c-blue);color:var(--c-blue-700);font-weight:650}
.fsearch{flex:1;min-width:200px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;font-size:12.5px}
.linkbtn{font-size:12px;color:var(--c-blue);font-weight:700;padding:6px 8px;border-radius:7px}
.linkbtn:hover{background:var(--c-blue-soft)}
.count{font-size:12px;color:var(--ink-3);font-weight:500;padding:0 4px}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
thead th{position:sticky;top:0;background:var(--surface-2);color:var(--ink-2);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}tbody tr:hover{background:#f7f9fc}
tbody tr:last-child td{border-bottom:none}
td.nowrap{white-space:nowrap}
.cell-t{font-weight:650}.cell-s{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.badge{display:inline-block;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:750;white-space:nowrap}
.b-Pendiente{background:var(--c-slate-soft);color:#4b5a70}.b-En-curso{background:var(--c-blue-soft);color:var(--c-blue-700)}
.b-En-revisión{background:var(--c-teal-soft);color:#1f5c63}.b-Bloqueado{background:var(--c-red-soft);color:var(--c-red)}
.b-Entregado{background:var(--c-ok-soft);color:var(--c-ok)}.b-Cancelado{background:#eceef1;color:#5d6676}
.late{display:block;font-size:11px;color:var(--c-red);font-weight:700;margin-top:3px}

/* ---------- ficha */
.drawer-bg{position:fixed;inset:0;background:rgba(8,26,48,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:50;box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.drawer__head{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer__k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.drawer__t{font-size:18px;font-weight:800;letter-spacing:-.01em;margin-top:3px}
.drawer__close{margin-left:auto;width:36px;height:36px;border-radius:8px;font-size:20px;color:var(--ink-2)}
.drawer__close:hover{background:var(--surface-2)}
.drawer__body{padding:16px 22px 28px;overflow:auto}
.dl{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:13px;margin:0}
.dl dt{color:var(--ink-3);font-weight:600}.dl dd{margin:0}
.sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:750;margin:20px 0 8px}
.diff{font-size:12.5px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.diff div{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:7px 10px;border-top:1px solid var(--line)}
.diff div:first-child{border-top:none}.diff del{color:var(--ink-3)}.diff ins{text-decoration:none;font-weight:650}
.hist{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line-2);margin-left:6px;padding-left:14px}
.hist div{position:relative;padding:5px 0;font-size:12.5px}
.hist div::before{content:"";position:absolute;left:-20px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--c-blue);border:2px solid #fff}

/* ---------- minuta */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:650;border:1px solid var(--line-2);background:var(--surface);color:var(--c-blue-700)}
.btn:hover:not(:disabled){background:var(--c-blue-soft)}
.btn.primary{background:var(--c-blue);border-color:var(--c-blue);color:#fff}.btn.primary:hover:not(:disabled){background:var(--c-blue-700)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{padding:8px 13px;font-size:12.5px;font-weight:650;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--c-blue);color:#fff}
.status-msg{font-size:12.5px;color:var(--ink-3);margin-left:4px}
.paper{background:#fff;max-width:816px;margin:0 auto;padding:46px 62px 52px;box-shadow:var(--shadow-sm);border:1px solid var(--line);font-family:Verdana,Geneva,sans-serif;font-size:12px;line-height:1.45;color:#000}
.paper .plogo{width:62px;display:block;margin-bottom:16px}
.paper .pk{text-align:center;font-weight:700}
.paper .pt{text-align:center;font-weight:700}
.paper .pr{text-align:center;margin-bottom:12px}
.paper .pdraft{text-align:center;font-weight:700;margin-top:2px}
.paper h3{background:#0e2841;color:#fff;font-size:12px;font-weight:700;margin:14px 0 6px;padding:2px 6px;text-transform:uppercase}
.paper p{margin:0 0 6px;text-align:justify}
.paper .pg{font-weight:700;margin:8px 0 3px}.paper .pg span{font-weight:400;color:#404040;font-size:10.5px}
.paper ul{margin:0 0 4px;padding-left:22px}.paper li{margin:0 0 4px;text-align:justify}
.paper .pn{font-style:italic;font-size:10.5px;margin:0 0 6px 22px}
.paper .pfoot{border-top:1px solid #999;margin-top:22px;padding-top:6px;font-size:9.5px}
.paper sup{font-size:8px}
.movtable{margin-top:22px}

/* ---------- calidad y carga */
.kv{display:grid;grid-template-columns:170px 1fr;gap:7px 14px;font-size:13px}
.kv dt{color:var(--ink-3);font-weight:600}.kv dd{margin:0}
.inc{list-style:none;margin:0;padding:0}.inc li{padding:8px 0;border-top:1px solid var(--line);font-size:12.5px;display:flex;gap:10px}
.inc li:first-child{border-top:none}
.lvl{font-size:10.5px;font-weight:800;border-radius:5px;padding:2px 6px;height:fit-content;white-space:nowrap}
.lvl.bloqueante{background:var(--c-red-soft);color:var(--c-red)}.lvl.observacion{background:var(--c-amber-soft);color:#7a5306}
.drop{border:2px dashed var(--line-2);border-radius:12px;padding:18px;text-align:center;color:var(--ink-2);font-size:13px}
.drop.over{border-color:var(--c-blue);background:var(--c-blue-soft)}
.field{display:grid;gap:4px;font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.field input{border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;font-size:13px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
.start{max-width:720px;margin:40px auto;text-align:center}
.start h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0 0 8px}
.start p{color:var(--ink-2)}

@media (max-width:1100px){.hero__stats{grid-template-columns:repeat(3,minmax(0,1fr))}.g3{grid-template-columns:1fr}.feed{grid-template-columns:1fr}}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}.app>*{min-width:0}.sidebar{position:static;height:auto;min-width:0}.sidebar__logo{width:72px}.hero__t{font-size:19px}.hero__side{text-align:left}.cutpick select{max-width:200px}.topbar{position:static}.nav{display:flex;overflow-x:auto;padding:8px}.nav__group,.sidebar__foot{display:none}.nav__item{white-space:nowrap;width:auto}.sidebar__brand{display:flex;gap:14px;align-items:center}.sidebar__k{margin-top:0}.g2{grid-template-columns:1fr}.hero__stats{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar{padding:10px 16px}.page{padding:16px}.banner{margin:12px 16px 0}.paper{padding:28px 22px}.srow{grid-template-columns:110px 1fr 70px}}
@page{size:letter;margin:20mm 22mm}
@media print{
  body{background:#fff}.sidebar,.topbar,.banner,.toolbar,.no-print,.drawer,.drawer-bg{display:none!important}
  .app{display:block}.page{padding:0;max-width:none}.paper{box-shadow:none;border:none;padding:0;max-width:none}
  .paper h3,.paper .pg{break-after:avoid}.paper li{break-inside:avoid}
  .paper h3{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

  /** Devuelve una función async leer(nombre, opcional) sobre el contenido del ZIP. */

      if (i + 46 > fin || num(i) !== 0x02014b50) throw new Error("La estructura del archivo no es válida.");

      if (previa && !idsValidos.has(id) && !retenidas.some(f => f.id === id)) {
        retenidas.push(Object.assign({}, previa, { id: id, held: true }));
        agregar("observacion", "registro_con_error", r.area, r.location + " (" + id + "): " + r.errors.join(", ") + ". Se mantiene la versión del corte anterior.");
      } else {
        agregar("observacion", "fila_excluida", r.area, r.location + (id ? " (" + id + ")" : "") + ": " + r.errors.join(", ") + ".");
      }
    }
    // Identidad del N°: si cambian a la vez fecha de ingreso y requerimiento, probablemente se reutilizó la fila.
    for (const f of validas) {
      const previa = mapaPrevio.get(f.id);
      if (previa && previa.received !== f.received && previa.request !== f.request) {
        agregar("bloqueante", "posible_reutilizacion", f.area, "El N° " + f.id + " cambió fecha de ingreso y requerimiento respecto del corte anterior. Verifica si la fila se usó para otro encargo.");
      }
    }
    const cobertura = new Set(lectura.coverage);
    for (const area of modelo.areas) {
      if (!cobertura.has(area.prefix) && !incidencias.some(i => i.area === area.prefix && i.level === "bloqueante")) agregar("bloqueante", "area_sin_datos", area.prefix, "No se pudo leer la pestaña «" + area.tab + "».");
    }
    if (previas) {
      for (const [id, f] of mapaPrevio) {
        if (cobertura.has(f.area) && !idsVistos.has(id)) {
          agregar("bloqueante", "registro_eliminado", f.area, "El registro " + id + " estaba en el corte anterior y ya no aparece en el Excel.");
        }
      }
    }
    if (captura && captura.late && !captura.verified) {
      agregar("bloqueante", "captura_demorada", "", "La captura se realizó a las " + (captura.capturedAtLocal || "?") + " y no se pudo verificar la versión de la hora programada.");
    }
    const filas = validas.concat(retenidas).sort((a, b) =>
      modelo.areas.findIndex(x => x.prefix === a.area) - modelo.areas.findIndex(x => x.prefix === b.area) || Number(a.number) - Number(b.number));
    const bloqueantes = incidencias.filter(i => i.level === "bloqueante").length;
    const corte = {
      format: FORMATO,
      from: anterior ? anterior.cut : desplazar(cut, -7),
      cut: cut,
      previousCut: anterior ? anterior.cut : null,
      status: bloqueantes ? "en_revision" : incidencias.length ? "valido_con_observaciones" : "valido",
      previousRows: previas ? previas.map(f => serializar(modelo, f)) : null,
      rows: filas.map(f => serializar(modelo, f)),
      rejected: rechazadas,
      incidents: incidencias
    };
    if (op.kind) corte.kind = op.kind;
    if (op.slot) corte.slot = op.slot;
    if (captura && captura.capturedAt) corte.capturedAt = captura.capturedAt;
    corte.summary = analizar(modelo, corte).summary;
    return corte;
  }

  /** Valida y normaliza un consolidado leído desde JSON. */
  function leerCorte(modelo, datos) {
    if (!datos || !FORMATOS_ACEPTADOS.includes(datos.format) || !fechaValida(datos.cut) || !fechaValida(datos.from)
      || datos.from > datos.cut || !Array.isArray(datos.rows)
      || (datos.previousRows !== null && datos.previousRows !== undefined && !Array.isArray(datos.previousRows))) {
      throw new Error("El archivo no corresponde a un consolidado DEPP compatible.");
    }
    const filas = filasDesdeJSON(modelo, datos.rows, "actual");
    const previas = Array.isArray(datos.previousRows) ? filasDesdeJSON(modelo, datos.previousRows, "anterior") : null;
    const ids = new Set();
    for (const f of filas) {
      if (ids.has(f.id)) throw new Error("El consolidado contiene el N° " + f.id + " repetido.");
      ids.add(f.id);
      if (f.received > datos.cut || (f.delivered && f.delivered > datos.cut)) throw new Error("El consolidado contiene fechas posteriores al corte (" + f.id + ").");
    }
    return {
      format: datos.format,
      from: datos.from,
      cut: datos.cut,
      previousCut: datos.previousCut ?? (previas ? datos.from : null),
      status: datos.status || "valido",
      previousRows: previas,
      rows: filas,
      rejected: datos.rejected || [],
      incidents: datos.incidents || [],
      summary: datos.summary || null,
      approval: datos.approval || null,
      kind: datos.kind || "semanal",
      slot: datos.slot || null,
      capturedAt: datos.capturedAt || null
    };
  }

  // ------------------------------------------------------------------ análisis del período
  function analizar(modelo, corte) {
    const cut = corte.cut;
    const from = corte.from;
    const comparando = Array.isArray(corte.previousRows);
    const idDe = f => f.id || (f.area + "-" + String(f.number).padStart(3, "0"));
    const mapaPrevio = new Map((corte.previousRows || []).map(f => [idDe(f), f]));
    const proximo = desplazar(cut, DIAS_PROXIMOS);
    const filas = corte.rows.map(original => {
      const f = Object.assign({}, original, { id: idDe(original) });
      const previa = mapaPrevio.get(f.id);
      const activo = !CERRADOS.includes(f.state);
      const notas = plegar(f.notes);
      const apoyo = activo && PATRON_APOYO.test(notas);
      const decision = apoyo && PATRON_DECISION.test(notas);
      const vencido = Boolean(activo && f.due && f.due < cut);
      let ingreso, entrega, cambios = [];
      if (comparando) {
        ingreso = !previa;
        entrega = f.state === "Entregado" && (!previa || previa.state !== "Entregado");
        if (previa) cambios = CAMPOS_CAMBIO.filter(k => (previa[k] ?? "") !== (f[k] ?? ""));
      } else {
        ingreso = Boolean(f.received && f.received >= from && f.received <= cut);
        entrega = Boolean(f.state === "Entregado" && f.delivered >= from && f.delivered <= cut);
      }
      const avance = Boolean(previa) && !entrega && cambios.length > 0;
      return Object.assign(f, {
        active: activo,
        late: vencido,
        blocked: f.state === "Bloqueado",
        support: apoyo,
        decision: decision,
        attention: vencido || f.state === "Bloqueado" || apoyo,
        upcoming: Boolean(activo && f.due && f.due >= cut && f.due <= proximo),
        undated: activo && !f.due,
        receivedNow: ingreso,
        lateEntry: comparando && ingreso && f.received < from,
        deliveredNow: entrega,
        deliveredLate: entrega && Boolean(f.due) && f.delivered > f.due,
        advancedNow: avance,
        cancelledNow: avance && f.state === "Cancelado" && cambios.includes("state"),
        changed: cambios,
        movement: ingreso || entrega || avance,
        held: Boolean(original.held)
      });
    });
    const contar = (lista, k) => lista.filter(f => f[k]).length;
    const resumenDe = lista => ({
      registros: lista.length,
      ingresos: contar(lista, "receivedNow"),
      ingresosTardios: contar(lista, "lateEntry"),
      entregas: contar(lista, "deliveredNow"),
      entregasFueraPlazo: contar(lista, "deliveredLate"),
      avances: contar(lista, "advancedNow"),
      cancelados: contar(lista, "cancelledNow"),
      abiertos: contar(lista, "active"),
      vencidos: contar(lista, "late"),
      bloqueados: lista.filter(f => f.active && f.blocked).length,
      apoyos: contar(lista, "support"),
      decisiones: contar(lista, "decision"),
      atencion: contar(lista, "attention"),
      proximos: contar(lista, "upcoming"),
      sinPlazo: contar(lista, "undated")
    });
    const resumen = resumenDe(filas);
    resumen.porArea = {};
    for (const area of modelo.areas) resumen.porArea[area.prefix] = resumenDe(filas.filter(f => f.area === area.prefix));
    return { rows: filas, summary: resumen, from: from, cut: cut, next: proximo, comparing: comparando };
  }

  // ------------------------------------------------------------------ minuta (modelo común)
  const ordenPlazo = (a, b) => cmp((a.due || "9999-99-99"), b.due || "9999-99-99") || cmp(a.id, b.id);

  function lineaMovimiento(f) {
    let texto;
    if (f.deliveredNow) {
      texto = "Entregado el " + fechaTexto(f.delivered) + " a " + f.requester + ".";
      if (f.deliveredLate) texto += " Fuera de plazo (plazo " + fechaTexto(f.due) + ").";
      if (f.receivedNow) texto += " Ingresó en el período.";
    } else if (f.advancedNow) {
      texto = f.state + ". Actualizó " + enumerar(f.changed.map(k => ETIQUETAS_CAMBIO[k])) + ".";
      if (f.changed.includes("due") && f.due) texto += " Nuevo plazo: " + fechaTexto(f.due) + ".";
    } else {
      texto = "Ingresó el " + fechaTexto(f.received) + " (" + f.kind + ", " + f.requester + "). Estado: " + f.state + ".";
      if (f.lateEntry) texto += " Registro tardío.";
      if (f.due) texto += " Plazo: " + fechaTexto(f.due) + ".";
    }
    const notas = cerrarFrase(f.notes);
    return { ref: f.id, lead: f.product + ".", text: texto + (notas ? " " + notas : "") };
  }

  function lineaAlerta(modelo, f) {
    const area = modelo.areas.find(a => a.prefix === f.area);
    const marcas = [];
    if (f.blocked) marcas.push("Bloqueado");
    if (f.late) marcas.push("Vencido desde el " + fechaTexto(f.due));
    const notas = cerrarFrase(f.notes);
    return { ref: f.id, lead: f.product + ".", text: marcas.join(". ") + ". " + f.owner + ", " + area.name + "." + (notas ? " " + notas : "") };
  }

  function lineaSolicitud(modelo, f) {
    const area = modelo.areas.find(a => a.prefix === f.area);
    return { ref: f.id, lead: (f.decision ? "Decisión" : "Apoyo") + " · " + f.product + ".",
      text: cerrarFrase(f.notes) + " Responsable: " + f.owner + ", " + area.name + "." + (f.due ? " Plazo: " + fechaTexto(f.due) + "." : "") };
  }

  function lineaProxima(f) {
    return { ref: f.id, lead: fechaTexto(f.due) + ".", text: f.product + " · " + f.owner + " · " + f.requester + (f.state !== "Pendiente" && f.state !== "En curso" ? " · " + f.state : "") + "." };
  }

  function recortar(lista, limite) {
    if (lista.length <= limite) return { items: lista, rest: 0 };
    return { items: lista.slice(0, limite), rest: lista.length - limite };
  }

  /**
   * Devuelve la minuta como estructura neutra. El tablero la dibuja en HTML y en Word;
   * el procesador la escribe en Word con el mismo contenido.
   * completo = true incluye todos los movimientos (detalle completo).
   */
  function minuta(modelo, corte, completo) {
    const a = analizar(modelo, corte);
    const s = a.summary;
    const actualizacion = corte.kind === "actualizacion";
    const momento = momentoSlot(corte.slot, a.cut);
    const periodo = actualizacion && !a.comparing
      ? "Actualización del " + momento + ". Aún no hay un corte semanal anterior para comparar; muestra la línea base."
      : actualizacion
      ? "Avance desde el corte del viernes " + fechaTexto(a.from) + " a las 12:00 hasta el " + momento + ". Es una actualización intermedia; la minuta oficial usa el corte del viernes a las 12:00."
      : a.comparing
      ? "Del viernes " + fechaTexto(a.from) + " a las 12:00 al viernes " + fechaTexto(a.cut) + " a las 12:00."
      : "Corte inicial al viernes " + fechaTexto(a.cut) + " a las 12:00. Considera ingresos y entregas desde el " + fechaTexto(a.from) + " y fija la línea base para comparar el corte siguiente.";
    const resumen = [
      "En el período se registraron " + plural(s.ingresos, "ingreso") + " y " + plural(s.entregas, "entrega")
        + (s.entregasFueraPlazo ? " (" + s.entregasFueraPlazo + " fuera de plazo)" : "")
        + (a.comparing ? ", y " + plural(s.avances, "compromiso tuvo avance", "compromisos tuvieron avance") : "") + ".",
      "Al corte hay " + plural(s.abiertos, "compromiso abierto", "compromisos abiertos") + ": "
        + plural(s.vencidos, "vencido") + ", " + plural(s.bloqueados, "bloqueado") + " y "
        + plural(s.apoyos, "con solicitud a Gabinete", "con solicitudes a Gabinete") + ".",
      (s.proximos ? "Vencen " + plural(s.proximos, "compromiso") : "No vencen compromisos") + " entre el " + fechaTexto(a.cut) + " y el " + fechaTexto(a.next) + "."
    ].join(" ");

    const equipos = [];
    for (const area of modelo.areas) {
      const propios = a.rows.filter(f => f.area === area.prefix && f.movement);
      const destacados = propios.filter(f => f.deliveredNow || f.advancedNow).sort((x, y) =>
        Number(y.deliveredNow) - Number(x.deliveredNow) || cmp((y.delivered || ""), x.delivered || "") || cmp(x.id, y.id));
      const ingresos = propios.filter(f => !f.deliveredNow && !f.advancedNow).sort((x, y) => cmp(y.received, x.received) || cmp(x.id, y.id));
      const r = area.prefix;
      const sa = s.porArea[r];
      let lista;
      let nota = "";
      if (completo) {
        lista = destacados.concat(ingresos);
      } else {
        const corte3 = recortar(destacados, 3);
        lista = corte3.items;
        const omitidos = corte3.rest;
        const ingresosResumen = ingresos.length;
        const partes = [];
        if (omitidos) partes.push(plural(omitidos, "entrega o avance adicional", "entregas o avances adicionales"));
        if (ingresosResumen) partes.push(plural(ingresosResumen, "ingreso nuevo", "ingresos nuevos"));
        if (partes.length) nota = "Además: " + enumerar(partes) + " (ver detalle completo).";
        if (!lista.length && ingresosResumen) { lista = recortar(ingresos, 2).items; nota = ingresosResumen > 2 ? "Además: " + plural(ingresosResumen - 2, "ingreso nuevo", "ingresos nuevos") + " (ver detalle completo)." : ""; }
      }
      const vacio = (corte.incidents || []).some(i => CODIGOS_SIN_DATOS.includes(i.code) && i.area === r)
        ? "Planilla del equipo no disponible en este corte."
        : "Sin movimientos registrados en el período.";
      equipos.push({
        title: area.name,
        counts: plural(sa.entregas, "entrega") + " · " + plural(sa.avances, "avance") + " · " + plural(sa.ingresos, "ingreso") + " · " + plural(sa.abiertos, "abierto"),
        items: lista.map(lineaMovimiento),
        note: lista.length ? nota : vacio
      });
    }
    const alertas = a.rows.filter(f => f.active && (f.blocked || f.late)).sort((x, y) =>
      Number(y.blocked) - Number(x.blocked) || ordenPlazo(x, y));
    const solicitudes = a.rows.filter(f => f.support).sort((x, y) => Number(y.decision) - Number(x.decision) || ordenPlazo(x, y));
    const proximos = a.rows.filter(f => f.upcoming).sort(ordenPlazo);
    const rAl = recortar(alertas, completo ? Infinity : 6);
    const rSo = recortar(solicitudes, completo ? Infinity : 6);
    const rPr = recortar(proximos, completo ? Infinity : 6);
    const mas = (n, sing, pl) => n ? "Además: " + plural(n, sing, pl) + " (ver detalle completo)." : "";
    const secciones = [
      { title: "Período y resumen", paragraphs: [periodo, resumen] },
      { title: "Principales entregas y avances por equipo", groups: equipos },
      { title: "Bloqueos y atrasos", items: rAl.items.map(f => lineaAlerta(modelo, f)), note: rAl.items.length ? mas(rAl.rest, "compromiso", "compromisos") : "Sin compromisos bloqueados ni vencidos al corte." },
      { title: "Decisiones y apoyos solicitados a Gabinete", items: rSo.items.map(f => lineaSolicitud(modelo, f)), note: rSo.items.length ? mas(rSo.rest, "solicitud", "solicitudes") : "Los equipos no registraron solicitudes de decisión o apoyo." },
      { title: "Próximos vencimientos (" + fechaTexto(a.cut) + " al " + fechaTexto(a.next) + ")", items: rPr.items.map(lineaProxima), note: rPr.items.length ? mas(rPr.rest, "vencimiento", "vencimientos") : "Sin vencimientos de compromisos abiertos en ese período." }
    ];
    const notas = [];
    if (corte.status === "en_revision") notas.push("Corte en revisión: " + enumerar([...new Set((corte.incidents || []).filter(i => i.level === "bloqueante").map(i => i.message))]));
    const obs = (corte.incidents || []).filter(i => i.level === "observacion").length;
    if (obs) notas.push("El corte registra " + plural(obs, "observación de carga", "observaciones de carga") + "; el detalle completo las identifica por equipo y fila.");
    notas.push("Fuente: planillas de seguimiento de los equipos DEPP, " + (actualizacion ? "captura del " + momento : "corte del viernes " + fechaTexto(a.cut) + " a las 12:00") + " (hora de Santiago). Un compromiso puede registrar más de un movimiento en el período.");
    return {
      institution: "SUBSECRETARÍA DE PREVENCIÓN DEL DELITO",
      kind: "MINUTA",
      title: "SEGUIMIENTO SEMANAL DE LA DIVISIÓN DE ESTUDIOS Y POLÍTICAS PÚBLICAS (DEPP)",
      recipient: actualizacion ? "Para: Jefatura DEPP · Actualización del " + momento : "Para: Gabinete SPD · Corte del " + fechaTexto(a.cut),
      draft: corte.status === "en_revision" || actualizacion,
      draftLabel: actualizacion ? "AVANCE INTERMEDIO · NO ES EL CORTE SEMANAL" : "BORRADOR · CORTE EN REVISIÓN",
      full: Boolean(completo),
      sections: secciones,
      notes: notas,
      summary: s
    };
  }

  /** Lista de movimientos para el detalle completo (una fila por movimiento). */
  function movimientos(modelo, corte) {
    const a = analizar(modelo, corte);
    const salida = [];
    for (const f of a.rows) {
      if (f.receivedNow) salida.push({ tipo: f.lateEntry ? "Ingreso (registro tardío)" : "Ingreso", fila: f, fecha: f.received, cambios: "" });
      if (f.deliveredNow) salida.push({ tipo: f.deliveredLate ? "Entrega fuera de plazo" : "Entrega", fila: f, fecha: f.delivered, cambios: "" });
      if (f.advancedNow) salida.push({ tipo: f.cancelledNow ? "Cancelación" : "Avance", fila: f, fecha: "", cambios: enumerar(f.changed.map(k => ETIQUETAS_CAMBIO[k])) });
    }
    const orden = { "Entrega": 0, "Entrega fuera de plazo": 0, "Avance": 1, "Cancelación": 1, "Ingreso": 2, "Ingreso (registro tardío)": 2 };
    salida.sort((x, y) => modelo.areas.findIndex(z => z.prefix === x.fila.area) - modelo.areas.findIndex(z => z.prefix === y.fila.area)
      || orden[x.tipo] - orden[y.tipo] || cmp(x.fila.id, y.fila.id));
    return salida;
  }

  return {
    FORMATO, FORMATOS_ACEPTADOS, CAMPOS_CAMBIO, ETIQUETAS_CAMBIO, DIAS_PROXIMOS,
    plegar, desplazar, fechaTexto, momentoSlot, fechaValida, fechaExcel, esViernes, viernesDeCorte, plural, enumerar,
    registro, serializar, construirCorte, leerCorte, analizar, minuta, movimientos
  };
});
</script>
<script>/* lector_xlsx.js · Carga manual de las planillas DEPP en el navegador (respaldo). */
(function (root) {
  "use strict";
  const utf8 = new TextDecoder();

  function nodos(el, nombre) { return Array.from(el.getElementsByTagNameNS("*", nombre)); }
  function xml(bytes, nombre) {
    const doc = new DOMParser().parseFromString(utf8.decode(bytes), "application/xml");
    if (nodos(doc, "parsererror").length) throw new Error("No se pudo leer " + nombre + ".");
    return doc;
  }
  function textoCelda(c, compartidos) {
    if (c.getAttribute("t") === "inlineStr") return nodos(c, "t").map(t => t.textContent).join("");
    const v = nodos(c, "v")[0]?.textContent ?? "";
    return c.getAttribute("t") === "s" ? compartidos[Number(v)] ?? "" : v;
  }
  function columna(ref) {
    const letras = /^[A-Z]+/.exec(ref ?? "")?.[0] ?? "";
    return Array.from(letras).reduce((s, l) => s * 26 + l.charCodeAt(0) - 64, 0) - 1;
  }
  function ruta(base, destino) {
    if (!destino) return "";
    if (destino.startsWith("/")) return destino.slice(1);
    const partes = base.split("/").slice(0, -1);
    for (const p of destino.split("/")) {
      if (p === "..") partes.pop(); else if (p !== ".") partes.push(p);
    }
    return partes.join("/");
  }
  function relaciones(doc) {
    return new Map(nodos(doc, "Relationship").filter(r => r.getAttribute("TargetMode") !== "External")
      .map(r => [r.getAttribute("Id"), r.getAttribute("Target")]));
  }

  /** Lee un .xlsx y devuelve {entries, coverage, problems} con el mismo criterio del procesador. */
  async function leerLibro(modelo, motor, archivo) {
    if (!/\.xlsx$/i.test(archivo.name) || archivo.size > 20000000) throw new Error("Selecciona archivos .xlsx de hasta 20 MB.");
    const zip = DEPPZip.abrir(await archivo.arrayBuffer());
    const [bLibro, bRel, bTextos] = await Promise.all([zip.leer("xl/workbook.xml"), zip.leer("xl/_rels/workbook.xml.rels"), zip.leer("xl/sharedStrings.xml", true)]);
    const libro = xml(bLibro, "la estructura del libro");
    const epoca1904 = ["1", "true"].includes(nodos(libro, "workbookPr")[0]?.getAttribute("date1904"));
    const rels = relaciones(xml(bRel, "las referencias del libro"));
    const compartidos = bTextos ? nodos(xml(bTextos, "los textos del libro"), "si").map(si => nodos(si, "t").map(t => t.textContent).join("")) : [];
    const hojas = new Map(nodos(libro, "sheet").map(h => {
      const id = Array.from(h.attributes).find(a => a.localName === "id")?.value;
      return [h.getAttribute("name"), ruta("xl/workbook.xml", rels.get(id))];
    }));
    const entries = [], coverage = [], problems = [];
    const encabezados = modelo.fields.map(f => f[1]);
    for (const area of modelo.areas) {
      if (!hojas.has(area.tab)) continue;
      const rutaHoja = hojas.get(area.tab);
      const hoja = xml(await zip.leer(rutaHoja), area.tab);
      // Tabla de Excel esperada (Carga_AET, Carga_EE, ...).
      const relHoja = await zip.leer(rutaHoja.replace(/([^/]+)$/, "_rels/$1.rels"), true);
      const tablas = [];
      if (relHoja) {
        for (const destino of relaciones(xml(relHoja, "las referencias de " + area.tab)).values()) {
          if (!/tables\//.test(destino)) continue;
          const t = await zip.leer(ruta(rutaHoja, destino), true);
          if (t) tablas.push(xml(t, "una tabla").documentElement.getAttribute("displayName") || xml(t, "una tabla").documentElement.getAttribute("name"));
        }
      }
      if (!tablas.includes(area.table)) {
        problems.push({ code: "tabla_ausente", area: area.prefix, message: "La pestaña «" + area.tab + "» no contiene la tabla " + area.table + "." });
        continue;
      }
      const filas = nodos(hoja, "row");
      const valores = fila => {
        const v = Array(modelo.fields.length).fill("");
        for (const c of nodos(fila, "c")) {
          const i = columna(c.getAttribute("r"));
          if (i >= 0 && i < v.length) v[i] = textoCelda(c, compartidos);
        }
        return v;
      };
      const cab = filas.find(f => f.getAttribute("r") === "3");
      if (!cab || valores(cab).some((t, i) => t.trim() !== encabezados[i])) {
        problems.push({ code: "encabezados_alterados", area: area.prefix, message: "Los encabezados de «" + area.tab + "» cambiaron. Restituye la fila 3 de la plantilla." });
        continue;
      }
      coverage.push(area.prefix);
      for (const fila of filas) {
        const linea = Number(fila.getAttribute("r"));
        if (linea < 4) continue;
        const v = valores(fila);
        if (!v.slice(1).some(x => x.trim())) continue;
        if (!v[0]) {
          // Si Excel no guardó el valor calculado, el N° está en la fórmula de la plantilla.
          const celdaA = nodos(fila, "c").find(c => columna(c.getAttribute("r")) === 0);
          const m = /,(\d+)\)$/.exec(nodos(celdaA ?? fila, "f")[0]?.textContent ?? "");
          v[0] = m ? m[1] : "";
        }
        entries.push(motor.registro(modelo, v, area, linea, epoca1904));
      }
    }
    if (!coverage.length && !problems.length) throw new Error(archivo.name + " no contiene pestañas de carga DEPP.");
    return { entries, coverage, problems, file: archivo.name };
  }

  async function leerArchivos(modelo, motor, archivos) {
    const libros = await Promise.all(archivos.map(a => leerLibro(modelo, motor, a)));
    const lectura = { entries: [], coverage: [], problems: [], files: [] };
    for (const l of libros) {
      for (const p of l.coverage) {
        if (lectura.coverage.includes(p)) lectura.problems.push({ code: "pestana_repetida", area: p, message: "La pestaña de " + p + " aparece en más de un archivo." });
        else lectura.coverage.push(p);
      }
      lectura.entries.push(...l.entries);
      lectura.problems.push(...l.problems);
      lectura.files.push(l.file);
    }
    return lectura;
  }

<script>/* docx.js · Minuta semanal en Word desde el tablero.
 * Produce el mismo XML que procesador/depp_corte/minuta_docx.py (prueba de paridad).
 */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.DEPPDocx = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";
  const esc = t => String(t ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const t = texto => '<w:t xml:space="preserve">' + esc(texto) + "</w:t>";
  const ref = n => '<w:r><w:rPr><w:rStyle w:val="Refdenotaalpie"/></w:rPr><w:footnoteReference w:id="' + n + '"/></w:r>';

  const pCentrado = (texto, negrita = true) =>
    '<w:p><w:pPr><w:keepNext/><w:spacing w:after="0" w:line="240" w:lineRule="auto"/><w:jc w:val="center"/></w:pPr>'
    + "<w:r>" + (negrita ? "<w:rPr><w:b/></w:rPr>" : "") + t(texto) + "</w:r></w:p>";
  const pTitulo = texto =>
    '<w:p><w:pPr><w:pStyle w:val="Ttulo"/><w:spacing w:after="0" w:line="240" w:lineRule="auto"/><w:jc w:val="center"/></w:pPr>'
    + "<w:r><w:rPr><w:b/></w:rPr>" + t(texto) + "</w:r></w:p>";
  const pVacio = () => '<w:p><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/><w:jc w:val="both"/></w:pPr></w:p>';
  const pBanda = texto =>
    '<w:p><w:pPr><w:pStyle w:val="Ttulo1"/><w:keepNext/><w:shd w:val="clear" w:color="auto" w:fill="0E2841"/>'
    + '<w:spacing w:before="160" w:after="80"/><w:ind w:firstLine="96"/></w:pPr>'
    + '<w:r><w:rPr><w:b/><w:color w:val="FFFFFF"/></w:rPr>' + t(texto) + "</w:r></w:p>";
  const pTexto = (texto, notas = []) =>
    '<w:p><w:pPr><w:spacing w:after="100" w:line="240" w:lineRule="auto"/><w:jc w:val="both"/></w:pPr>'
    + "<w:r>" + t(texto) + "</w:r>" + notas.map(ref).join("") + "</w:p>";
  const pGrupo = (titulo, conteo) =>
    '<w:p><w:pPr><w:keepNext/><w:spacing w:before="80" w:after="40"/><w:jc w:val="both"/></w:pPr>'
    + "<w:r><w:rPr><w:b/></w:rPr>" + t(titulo) + "</w:r>"
    + '<w:r><w:rPr><w:color w:val="404040"/><w:sz w:val="16"/></w:rPr>' + t(" · " + conteo) + "</w:r></w:p>";
  const pVineta = (lead, texto) =>
    '<w:p><w:pPr><w:pStyle w:val="Sinespaciado"/><w:numPr><w:ilvl w:val="0"/><w:numId w:val="5"/></w:numPr>'
    + '<w:spacing w:after="60"/><w:ind w:left="360"/><w:jc w:val="both"/></w:pPr>'
    + "<w:r><w:rPr><w:b/></w:rPr>" + t(lead) + "</w:r><w:r>" + t(" " + texto) + "</w:r></w:p>";
  const pNota = texto =>
    '<w:p><w:pPr><w:spacing w:after="80"/><w:ind w:left="360"/><w:jc w:val="both"/></w:pPr>'
    + '<w:r><w:rPr><w:i/><w:sz w:val="16"/></w:rPr>' + t(texto) + "</w:r></w:p>";
  const notaPie = (n, texto) =>
    '<w:footnote w:id="' + n + '"><w:p><w:pPr><w:pStyle w:val="Textonotapie"/><w:jc w:val="both"/></w:pPr>'
    + '<w:r><w:rPr><w:rStyle w:val="Refdenotaalpie"/></w:rPr><w:footnoteRef/></w:r>'
    + '<w:r><w:rPr><w:rFonts w:ascii="Verdana" w:hAnsi="Verdana" w:cs="Verdana"/><w:sz w:val="14"/></w:rPr>'
    + t(" " + texto) + "</w:r></w:p></w:footnote>";

  function cuerpoMinuta(m) {
    const partes = [pCentrado(m.kind)];
    if (m.draft) partes.push(pCentrado(m.draftLabel || "BORRADOR · CORTE EN REVISIÓN"));
    partes.push(pTitulo(m.title), pCentrado(m.recipient, false), pVacio());
    const notas = m.notes || [];
    const ids = notas.map((_, i) => i + 1);
    m.sections.forEach((sec, k) => {
      const i = k + 1;
      partes.push(pBanda(i + ". " + sec.title.toUpperCase()));
      (sec.paragraphs || []).forEach((p, j) => partes.push(pTexto(p, i === 1 && j === 0 ? ids : [])));
      for (const g of sec.groups || []) {
        partes.push(pGrupo(g.title, g.counts));
        for (const it of g.items) partes.push(pVineta(it.lead, it.text));
        if (g.note) partes.push(pNota(g.note));
      }
      for (const it of sec.items || []) partes.push(pVineta(it.lead, it.text));
      if (sec.note) partes.push(pNota(sec.note));
    });
    return [partes.join(""), ids.map((n, i) => notaPie(n, notas[i])).join("")];
  }

  /** plantilla: ArrayBuffer de base_minuta_depp.docx. Devuelve un Blob .docx. */
  async function escribir(m, plantilla) {
    const zip = DEPPZip.abrir(plantilla);
    const dec = new TextDecoder();
    const enc = new TextEncoder();
    const [cuerpo, pies] = cuerpoMinuta(m);
    const partes = [];
    for (const nombre of zip.nombres()) {
      let datos = await zip.leer(nombre);
      if (nombre === "word/document.xml") {
        const doc = dec.decode(datos);
        const ini = doc.indexOf("<w:body>") + "<w:body>".length;
        const sect = doc.lastIndexOf("<w:sectPr");
        datos = enc.encode(doc.slice(0, ini) + cuerpo + doc.slice(sect));
      } else if (nombre === "word/footnotes.xml") {
        const fn = dec.decode(datos).replace(/<w:footnote w:id="[1-9]\d*">[\s\S]*?<\/w:footnote>/g, "");
        datos = enc.encode(fn.replace("</w:footnotes>", pies + "</w:footnotes>"));
      }
      partes.push([nombre, datos]);
    }
    return DEPPZip.escribir(partes);
  }

  return { cuerpoMinuta, escribir };
});

<script>/* app.js · Interfaz del tablero de seguimiento semanal DEPP. */
(function () {
  "use strict";
  const M = DEPPMotor;

    compromisos: ["Compromisos", "Registro consolidado de los cuatro equipos, con filtros y ficha de detalle"],

  async function entradasDesdeHandle(handle) {

    const leerTurno = async (nombre, h) => {
      for await (const [archivo, h2] of h.entries()) if (h2.kind === "file") salida.push({ turno: nombre, nombre: archivo, file: () => h2.getFile() });
    };
    if (RE_TURNO.test(raiz.name)) await leerTurno(raiz.name, raiz);

  }
  function entradasDesdeLista(archivos) {
    return archivos.map(f => {

  }
  function metaCaptura(meta) {
    if (!meta || !meta.capturedAt) return { capturedAt: null, late: false, verified: false };
    const cap = Date.parse(meta.capturedAt);
    const prog = meta.scheduledAt ? Date.parse(meta.scheduledAt) : NaN;
    return { capturedAt: meta.capturedAt, capturedAtLocal: momentoTexto(meta.capturedAt), late: isFinite(prog) && cap - prog > 30 * 60000, verified: Boolean(meta.verified) };
  }
  async function construirTurno(entradas, turno, anterior, kind) {
    const xlsx = [];
    let meta = null;
    for (const e of entradas) {
      if (/\.xlsx$/i.test(e.nombre) && !e.nombre.startsWith("~$")) {
        const f = await conLimite(e.file(), 30000, turno + "/" + e.nombre);
        await conLimite(f.slice(0, 4).arrayBuffer(), 30000, turno + "/" + e.nombre);
        xlsx.push(f);
      } else if (e.nombre === "captura.json") {
        try { meta = JSON.parse(await (await conLimite(e.file(), 30000, turno + "/captura.json")).text()); } catch (err) { meta = null; }
      }
    }
    const conocidos = xlsx.filter(f => modelo.books.some(b => b.file === f.name));
    const lectura = conocidos.length ? await DEPPLectorXlsx.leerArchivos(modelo, M, conocidos) : { entries: [], coverage: [], problems: [], files: [] };
    for (const libro of modelo.books) {
      if (!conocidos.some(f => f.name === libro.file)) {
        for (const p of libro.prefixes) lectura.problems.push({ code: "archivo_ausente", area: p, message: "Falta " + libro.file + " en la captura " + turno + "." });

  async function procesarCapturas(entradas, nombreCarpeta) {

    }
    await idb.set("carpeta", h);
    await leerHandle(h);
  }
  async function actualizarCarpeta() {
    const h = await idb.get("carpeta");
    if (!h || !h.queryPermission) { conectarCarpeta(); return; }
    let permiso = await h.queryPermission({ mode: "read" });
    if (permiso !== "granted") permiso = await h.requestPermission({ mode: "read" });
    if (permiso === "granted") await leerHandle(h);
  }
  /** Último turno programado que ya debería estar en la carpeta (con 45 minutos de margen). */
  function turnoEsperado() {
    const h = hoySantiago();
    for (let i = 0; i < 8; i++) {
      const dia = M.desplazar(h.dia, -i);
      const ds = new Date(dia + "T00:00:00Z").getUTCDay();
      if (ds === 0 || ds === 6) continue;
      const horas = ds === 5 ? ["1700", "1200", "0900"] : ["1700", "0900"];
      for (const hh of horas) {
        const minutos = Number(hh.slice(0, 2)) * 60 + Number(hh.slice(2)) + 45;
        if (i > 0 || h.hora >= minutos) return dia + "_" + hh;
      }
    }
    return null;
  }

    for (const b of document.querySelectorAll(".nav__item")) b.setAttribute("aria-current", b.dataset.view === st.view ? "page" : "false");

  function renderTopbar() {
    const sel = $("cut-select");

    sel.innerHTML = cortes.slice().reverse().map(c =>
      '<option value="' + c + '"' + (c === st.cut ? " selected" : "") + ">" + esc(etiquetaClave(c)) + " · " + esc(ESTADOS_TXT[estadoDe(c)]) + "</option>").join("");
    $("cut-dot").className = "dot " + (st.cut ? estadoDe(st.cut) : "");

      $("update-label").textContent = "Última captura: " + M.momentoSlot(ultimo) + " · leída " + momentoTexto(st.carpeta.leidaEn).slice(11);
    } else if (st.index && st.index.lastRun) {
      meta.hidden = false;

  function renderBanners() {
    const out = [];
    const ban = (tipo, html) => out.push('<div class="banner ' + tipo + '">' + html + "</div>");
    if (st.origin === "demo") ban("info", "<strong>Demostración con datos ficticios.</strong> Los registros, nombres y cifras son ilustrativos. El tablero operativo lee la carpeta institucional de capturas en OneDrive.");
    if (st.cut && st.manual.has(st.cut)) ban("info", "<strong>Carga manual sin publicar.</strong> Este corte se armó en el navegador con los Excel seleccionados. Puedes guardarlo como consolidado desde «Calidad y carga».");
    if (st.cut && esIntermedio(st.cut)) ban("info", "<strong>Actualización intermedia (" + esc(M.momentoSlot(st.cut)) + ").</strong> Muestra el avance desde el último corte semanal. La minuta para Gabinete se arma con el corte del viernes a las 12:00.");
    const lr = st.index && st.index.lastRun;
    if (lr && lr.status === "fallido") ban("bad", "<strong>La actualización del corte del " + ft(lr.cut) + " falló</strong> (" + esc(momentoTexto(lr.at)) + "): " + esc(lr.result) + " Se mantiene el último corte válido.");
    else if (lr && lr.status === "en_revision" && fechaClave(st.cut || "") !== lr.cut) ban("warn", "<strong>El corte del " + ft(lr.cut) + " quedó en revisión.</strong> Se muestra el último corte válido (" + ft(st.index.lastValid || "") + "). Revisa las incidencias en «Calidad y carga».");
    if (st.cut && st.norm[st.cut].status === "en_revision") {
      const bloq = (st.norm[st.cut].incidents || []).filter(i => i.level === "bloqueante");
      ban("bad", "<strong>Corte en revisión: cifras preliminares.</strong> " + esc(bloq.slice(0, 2).map(i => i.message).join(" ")) + (bloq.length > 2 ? " (+" + (bloq.length - 2) + " más)" : ""));
    }
    if (st.origin === "carpeta" && st.carpeta) {
      const esperado = turnoEsperado();
      if (esperado && !st.carpeta.turnos.includes(esperado) && esperado > st.carpeta.turnos[st.carpeta.turnos.length - 1]) {
        ban("warn", "<strong>Falta la captura del " + esc(M.momentoSlot(esperado)) + ".</strong> Revisa el historial del flujo «DEPP - Captura de planillas» en Power Automate o espera a que OneDrive termine de sincronizar, y pulsa «Actualizar».");
      }
      if (st.carpeta.errores.length) ban("bad", "<strong>No se pudieron leer algunas capturas:</strong> " + esc(st.carpeta.errores.join(" · ")));
    }
    if (st.index && (st.origin === "procesador" || st.origin === "http")) {
      const esperado = corteEsperado();
      if (!st.index.cuts.some(c => c.cut === esperado) && (!lr || lr.cut !== esperado)) {
        ban("warn", "<strong>Corte del viernes " + ft(esperado) + " pendiente.</strong> La actualización programada a las 12:00 aún no se publica. Se muestra el corte del " + ft(st.index.lastValid || fechaClave(st.cut || "")) + ".");
      }
    }
    $("banners").innerHTML = out.join("");
  }

      + "</ul>" + (movs.length > 12 ? '<button class="more" data-preset="movement">Ver todos los movimientos →</button>' : "") + "</div></section>";

  // ------------------------------------------------------------------ compromisos
  const PRESETS = {
    all: ["Todos los registros al corte", () => true],
    movement: ["Con movimiento en el período", f => f.movement],
    entregas: ["Entregados en el período", f => f.deliveredNow],
    avances: ["Con avance en el período", f => f.advancedNow],
    ingresos: ["Ingresados en el período", f => f.receivedNow],
    abiertos: ["Compromisos abiertos", f => f.active],
    alertas: ["Atrasados o bloqueados", f => f.active && (f.late || f.blocked)],
    solicitudes: ["Requieren decisión o apoyo", f => f.support],
    proximos: ["Vencen en los próximos 7 días", f => f.upcoming],
    sinplazo: ["Abiertos sin plazo", f => f.undated]
  };
  function filtrar(a) {
    const F = st.filters;
    const q = M.plegar(F.q.trim());
    return a.rows.filter(f => (!F.area || f.area === F.area) && (!F.state || f.state === F.state) && (!F.requester || f.requester === F.requester)
      && PRESETS[F.view][1](f) && (!q || M.plegar([f.id, f.product, f.request, f.owner, f.requester, f.notes].join(" ")).includes(q)));
  }
  function movChip(f) {
    const out = [];
    if (f.deliveredNow) out.push('<span class="chip mov-e">Entrega</span>');
    if (f.advancedNow) out.push('<span class="chip ' + (f.cancelledNow ? "mov-c" : "mov-a") + '">' + (f.cancelledNow ? "Cancelación" : "Avance") + "</span>");
    if (f.receivedNow) out.push('<span class="chip mov-i">Ingreso</span>');
    return out.join(" ");
  }
  function badge(f) {
    let h = '<span class="badge ' + claseEstado(f.state) + '">' + esc(f.state) + "</span>";
    if (f.late) h += '<span class="late">Vencido hace ' + M.plural(diasEntre(f.due, st.norm[st.cut].cut), "día") + "</span>";

    return h;
  }
  function vistaCompromisos(a) {
    const F = st.filters;
    const filas = filtrar(a);

      + '<select class="fsel' + (F.view !== "all" ? " is-set" : "") + '" data-f="view" aria-label="Vista">' + Object.entries(PRESETS).map(([k, v]) => opt(k, v[0], F.view)).join("") + "</select>"

      : '<tr><td colspan="8" class="empty-note">Sin registros para estos filtros.</td></tr>';

  }

  // ------------------------------------------------------------------ ficha de detalle
  function abrirFicha(id) {
    const a = analisis();
    const f = a.rows.find(x => x.id === id);
    if (!f) return;
    const area = AREAS.get(f.area);
    const prev = (st.norm[st.cut].previousRows || []).find(x => x.id === id);
    const filas = [["Equipo", area.name], ["Fecha de ingreso", ft(f.received)], ["Requerimiento", f.request], ["Producto comprometido", f.product], ["Tipo de encargo", f.kind],

  function minutaHTML(m) {

    m.sections.forEach((s, i) => {
      h += "<h3>" + (i + 1) + ". " + esc(s.title) + "</h3>";
      (s.paragraphs || []).forEach((p, j) => { h += "<p>" + esc(p) + (i === 0 && j === 0 ? notas.map((_, k) => "<sup>" + (k + 1) + "</sup>").join("") : "") + "</p>"; });
      for (const g of s.groups || []) {
        h += '<div class="pg">' + esc(g.title) + " <span>· " + esc(g.counts) + "</span></div>";
        if (g.items.length) h += "<ul>" + g.items.map(it => "<li><strong>" + esc(it.lead) + "</strong> " + esc(it.text) + "</li>").join("") + "</ul>";
        if (g.note) h += '<div class="pn">' + esc(g.note) + "</div>";
      }
      if ((s.items || []).length) h += "<ul>" + s.items.map(it => "<li><strong>" + esc(it.lead) + "</strong> " + esc(it.text) + "</li>").join("") + "</ul>";
      if (s.note) h += '<div class="pn">' + esc(s.note) + "</div>";
    });

  }
  function minutaTexto(m) {
    const l = [m.kind, m.draft ? (m.draftLabel || "BORRADOR · CORTE EN REVISIÓN") : "", m.title, m.recipient, ""].filter((x, i) => x || i === 4);
    m.sections.forEach((s, i) => {
      l.push((i + 1) + ". " + s.title.toUpperCase());
      for (const p of s.paragraphs || []) l.push(p);
      for (const g of s.groups || []) { l.push(g.title + " · " + g.counts); for (const it of g.items) l.push("• " + it.lead + " " + it.text); if (g.note) l.push("  " + g.note); }

      if (s.note) l.push("  " + s.note);
      l.push("");
    });

  function verificacion(corte, s) {
    if (!corte.summary) return "";
    const claves = ["ingresos", "entregas", "avances", "abiertos", "vencidos", "bloqueados", "apoyos", "proximos"];

  function base64(b64) {
    const bin = atob(b64.trim());
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out.buffer;
  }

  // ------------------------------------------------------------------ acciones
  async function cargarExcel(archivos) {
    const msg = $("manual-status");
    const cutInput = $("manual-cut");
    const cut = cutInput ? cutInput.value : corteEsperado();
    try {
      if (!M.fechaValida(cut) || !M.esViernes(cut)) throw new Error("La fecha de corte debe ser un viernes.");
      if (msg) msg.textContent = "Leyendo " + archivos.length + " archivos…";
      const lectura = await DEPPLectorXlsx.leerArchivos(modelo, M, archivos);
      const previos = cortesOrdenados().filter(c => fechaClave(c) < cut && !esIntermedio(c) && st.norm[c].status !== "en_revision");
      const anterior = previos.length ? st.norm[previos[previos.length - 1]] : null;
      const corte = M.construirCorte(modelo, lectura, cut, anterior, null);
      if (!st.origin) st.origin = "manual";
      st.cut = agregarCorte(corte, true);
      st.view = "calidad";
      render();
      const m2 = $("manual-status");
      if (m2) m2.textContent = "Corte armado con " + lectura.files.length + " archivos" + (anterior ? ", comparado con el corte del " + ft(anterior.cut) : ", sin corte anterior (línea base)") + ".";
    } catch (e) {
      if (msg) msg.textContent = e.message; else alertaSimple(e.message);
    }
  }
  function alertaSimple(texto) {
    $("banners").insertAdjacentHTML("afterbegin", '<div class="banner bad">' + esc(texto) + "</div>");
  }
  async function abrirJSON(archivo) {
    try {
      const raw = JSON.parse(await archivo.text());
      if (!st.origin) st.origin = "manual";
      st.cut = agregarCorte(raw, false);
      render();
    } catch (e) {
      alertaSimple(e.message || "No se pudo leer el consolidado.");
    }
  }
  function csv() {
    const filas = filtrar(analisis());
    const cab = ["Referencia", "Equipo", ...modelo.fields.slice(1).map(f => f[1]), "Movimiento en el período", "Alertas"];
    const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
    const lineas = [cab.map(q).join(";")].concat(filas.map(f => [f.id, AREAS.get(f.area).name, ft(f.received), f.request, f.product, f.kind, f.requester, f.owner, ft(f.due), f.state, ft(f.delivered), f.notes,
      [f.receivedNow && "Ingreso", f.deliveredNow && "Entrega", f.advancedNow && "Avance"].filter(Boolean).join(", "),
      [f.late && "Vencido", f.blocked && f.active && "Bloqueado", f.support && (f.decision ? "Decisión" : "Apoyo")].filter(Boolean).join(", ")].map(q).join(";")));
    descargar(new Blob(["﻿" + lineas.join("\r\n")], { type: "text/csv;charset=utf-8" }), "Compromisos_DEPP_" + nombreArchivo() + ".csv");
  }
  function nombreArchivo() { return esIntermedio(st.cut) ? st.cut : fechaClave(st.cut); }
  async function accion(e) {
    const act = e.currentTarget.dataset.act;
    if (act === "carpeta") conectarCarpeta();
    else if (act === "carpeta-alt") $("file-dir").click();
    else if (act === "actualizar") actualizarCarpeta();
    else if (act === "xlsx") $("file-xlsx").click();
    else if (act === "json") $("file-json").click();
    else if (act === "limpiar") { st.filters = Object.assign({}, FILTROS_VACIOS); render(); }
    else if (act === "csv") csv();
    else if (act === "imprimir") window.print();
    else if (act === "copiar") {
      const texto = minutaTexto(M.minuta(modelo, st.norm[st.cut], st.full));
      try { await navigator.clipboard.writeText(texto); $("minuta-status").textContent = "Minuta copiada al portapapeles."; }
      catch (err) { $("minuta-status").textContent = "El navegador no permitió copiar. Usa «Descargar Word»."; }
    } else if (act === "word") {
      const m = M.minuta(modelo, st.norm[st.cut], st.full);
      const blob = await DEPPDocx.escribir(m, base64(document.getElementById("plantilla-docx").textContent));
      descargar(new Blob([blob], { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" }), "Minuta_DEPP_" + nombreArchivo() + (st.full ? "_detalle" : "") + ".docx");
      $("minuta-status").textContent = "Minuta descargada. Revísala antes de remitirla a Gabinete SPD.";
    } else if (act === "guardar") {
      descargar(new Blob([JSON.stringify(st.raw[st.cut], null, 1)], { type: "application/json" }), "Corte_DEPP_" + nombreArchivo() + ".json");
    }
  }
  function enlazarVista() {
    const page = $("page");
    for (const b of page.querySelectorAll("[data-act]")) b.addEventListener("click", accion);
    for (const b of page.querySelectorAll("[data-open]")) {
      b.addEventListener("click", () => abrirFicha(b.dataset.open));
      if (b.tagName === "TR") b.addEventListener("keydown", e => { if (e.key === "Enter") abrirFicha(b.dataset.open); });
    }
    for (const b of page.querySelectorAll("[data-preset]")) b.addEventListener("click", () => { st.filters = Object.assign({}, FILTROS_VACIOS, { view: b.dataset.preset }); st.view = "compromisos"; render(); });
    for (const b of page.querySelectorAll("[data-area]")) b.addEventListener("click", () => { st.filters = Object.assign({}, FILTROS_VACIOS, { area: b.dataset.area, view: "abiertos" }); st.view = "compromisos"; render(); });
    for (const b of page.querySelectorAll("[data-full]")) b.addEventListener("click", () => { st.full = b.dataset.full === "1"; render(); });
    for (const r of page.querySelectorAll("tr[data-cut]")) r.addEventListener("click", () => { st.cut = r.dataset.cut; render(); });
    for (const el of page.querySelectorAll("[data-f]")) {
      const ev = el.tagName === "INPUT" ? "input" : "change";
      el.addEventListener(ev, () => {
        st.filters[el.dataset.f] = el.value;
        const pos = el.selectionStart;
        render();
        if (el.tagName === "INPUT") { const n = $("page").querySelector('[data-f="q"]'); n.focus(); n.setSelectionRange(pos, pos); }
      });
    }
    const drop = $("drop");
    if (drop) {
      drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
      drop.addEventListener("dragleave", () => drop.classList.remove("over"));
      drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); const fs = Array.from(e.dataTransfer.files).filter(f => /\.xlsx$/i.test(f.name)); if (fs.length) cargarExcel(fs); });
    }
  }

    for (const b of document.querySelectorAll(".nav__item")) b.addEventListener("click", () => { st.view = b.dataset.view; render(); $("page").focus && window.scrollTo(0, 0); });
    $("cut-select").addEventListener("change", e => { st.cut = e.target.value; render(); });
    $("file-xlsx").addEventListener("change", e => { const fs = Array.from(e.target.files); e.target.value = ""; if (fs.length) cargarExcel(fs); });
    $("file-json").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if (f) abrirJSON(f); });
    $("file-dir").addEventListener("change", async e => {
      const fs = Array.from(e.target.files);
      e.target.value = "";
      if (!fs.length) { estadoCarpeta("La carpeta elegida no tiene archivos o el navegador no los entregó.", "warn"); return; }
      const nombre = (fs[0].webkitRelativePath || "").split("/")[0];
      estadoCarpeta("Recibí " + M.plural(fs.length, "archivo") + " de «" + nombre + "». Procesando…");
      try { await procesarCapturas(entradasDesdeLista(fs), nombre); }
      catch (err) { console.error(err); estadoCarpeta(err.message, "bad"); }
    });
    $("btn-actualizar").addEventListener("click", actualizarCarpeta);
    if (embebidos) cargarEmbebidos(embebidos);
    else if (/^https?:$/.test(location.protocol) && await cargarRemoto()) { /* datos publicados en el servidor */ }
    else {
      const h = await idb.get("carpeta");
      if (h && h.queryPermission) {
        if (await h.queryPermission({ mode: "read" }) === "granted") { await leerHandle(h); return; }
        st.carpetaPendiente = h.name;
      }
    }
    render();
  }
  iniciar();
})();
</script>
</body>
</html>
