name: Pruebas
on:
  push:
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencias
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Construir tablero y ejemplos ficticios
        run: python herramientas/construir_todo.py
      - name: Pruebas
        run: python -m pytest -q pruebas
      - name: Verificar que los archivos construidos están al día
        run: git diff --exit-code -- docs tablero/dist ':(glob)ejemplos/salidas/**/*.json' || (echo "Ejecute herramientas/construir_todo.py y confirme los cambios" && exit 1)
